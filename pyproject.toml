[project]
name = "multiconnect"
version = "0.1.0"
description = "Turn many browser AI chats into sandboxed coding agents commanded by Claude via MCP"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "websockets>=12",
  "httpx>=0.27",
  "playwright>=1.44",
  "mcp>=1.2,<2",
  "pyyaml>=6",
  "pydantic>=2.6",
  "pillow>=10",
  "psutil>=5.9",
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
multiconnect = "multiconnect.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["multiconnect"]
