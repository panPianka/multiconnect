name: Mistral Le Chat
enabled: true
context_tokens: 64000
home_url: https://chat.mistral.ai/chat
new_chat_url: https://chat.mistral.ai/chat
login_url: https://chat.mistral.ai/chat
selectors:
  input: "div.ProseMirror[contenteditable='true'], textarea"
  send_button: "button[type='submit'], button[aria-label*='Send']"
  stop_button: "button[aria-label*='Stop']"
  assistant_message: "[data-message-author-role='assistant'], div.prose"
  code_block: "pre"
  logged_in: "div.ProseMirror, textarea"
  login_required: "input[type='password']"
send_with: enter
input_mode: paste
url_login_patterns: ["auth.mistral.ai", "/login"]
