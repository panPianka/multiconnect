name: HuggingChat
enabled: false
context_tokens: 32000
home_url: https://huggingface.co/chat/
new_chat_url: https://huggingface.co/chat/
login_url: https://huggingface.co/login
selectors:
  input: "textarea"
  send_button: "button[type='submit'], button[aria-label*='Send']"
  stop_button: "button[aria-label*='Stop']"
  assistant_message: "[data-message-role='assistant'] .prose, .prose"
  code_block: "pre"
  logged_in: "textarea"
  login_required: ""
send_with: enter
url_login_patterns: ["/login"]
