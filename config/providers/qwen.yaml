name: Qwen Chat
enabled: true
context_tokens: 64000
home_url: https://chat.qwen.ai/
new_chat_url: https://chat.qwen.ai/
login_url: https://chat.qwen.ai/auth
selectors:
  input: "textarea#chat-input, textarea"
  send_button: "button#send-message-button, button[type='submit']"
  stop_button: "button[aria-label*='Stop'], .stop-button"
  assistant_message: ".response-message-content, .chat-response-message"
  code_block: "pre"
  logged_in: "textarea"
  login_required: "input[type='password']"
send_with: enter
url_login_patterns: ["/auth"]
